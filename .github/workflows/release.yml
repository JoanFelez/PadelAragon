name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from gradle.properties
        id: v
        run: |
          major=$(sed -n 's/^appVersionMajor=//p' gradle.properties | tr -d '\r ')
          minor=$(sed -n 's/^appVersionMinor=//p' gradle.properties | tr -d '\r ')
          patch=$(sed -n 's/^appVersionPatch=//p' gradle.properties | tr -d '\r ')
          version="${major}.${minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties version v${version}"
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. Refusing to build an unsigned or newly-keyed APK: a different signing key would force users to uninstall and lose their data. Add the original release keystore secrets and re-run."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PADEL_BACKEND_URL: ${{ secrets.WORKER_URL }}
          PADEL_APP_KEY: ${{ secrets.APP_KEY }}
        run: ./gradlew :androidApp:assembleRelease --console=plain

      - name: Verify APK is signed
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers (.exe, .msi)
        env:
          PADEL_BACKEND_URL: ${{ secrets.WORKER_URL }}
          PADEL_APP_KEY: ${{ secrets.APP_KEY }}
        run: .\gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi --console=plain
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  desktop-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build Linux .deb
        env:
          PADEL_BACKEND_URL: ${{ secrets.WORKER_URL }}
          PADEL_APP_KEY: ${{ secrets.APP_KEY }}
        run: ./gradlew :desktopApp:packageDeb --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, desktop-windows, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PadelAragon $TAG" \
            --verify-tag \
            --generate-notes
