name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Check, build Android debug APK, Linux package and scraper
        run: ./gradlew check :androidApp:assembleDebug :desktopApp:packageDeb :scraper:build --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PadelAragon-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: PadelAragon-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Windows installers (.exe, .msi)
        run: .\gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi --console=plain
        shell: pwsh

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: PadelAragon-windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: PadelAragon-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

      - run: npx wrangler deploy --dry-run
